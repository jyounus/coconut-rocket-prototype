<!doctype html><meta charset="utf-8"><title>Cartoon Compare</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<style>html,body{margin:0;background:#141018;color:#fff;font:15px "Lilita One",sans-serif}
.row{display:flex;gap:14px;padding:14px;align-items:flex-start}.cell{text-align:center;flex-shrink:0}.cell img,.cell canvas{height:800px;display:block;border-radius:8px}</style>
<div class="row">
 <div class="cell"><img src="../../zones-report/now-jungle.jpg"><p>the game today (jungle)</p></div>
 <div class="cell"><img id="day"><p>map: day</p></div>
 <div class="cell"><img id="dusk"><p>map: dusk</p></div>
 <div class="cell"><canvas id="crop" width="1040" height="1600" style="width:520px"></canvas><p>2x crop: hut and pad (day)</p></div>
</div>
<script>
const dir = new URLSearchParams(location.search).get('dir');
const d = new Image(), k = new Image(); let n = 0; const done = () => { if (++n < 2) return;
  const cv = document.getElementById('crop'), c = cv.getContext('2d');
  // the crop: 260 x 400 CSS px of the 1170-wide render (3 px each) shown at 2x the panels' scale
  c.drawImage(d, 128 * 3, 440 * 3, 260 * 3, 400 * 3, 0, 0, 1040, 1600); document.title = 'done'; };
d.onload = k.onload = done; d.src = 'file://' + dir + '/day.png'; k.src = 'file://' + dir + '/dusk.png';
document.getElementById('day').src = d.src; document.getElementById('dusk').src = k.src;
</script>
