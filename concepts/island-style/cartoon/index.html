<!doctype html><meta charset="utf-8"><title>Island Cartoon Sample</title>
<meta name="viewport" content="width=390">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<style>html,body{margin:0;background:#0d1a24}canvas{display:block}</style>
<canvas id="c"></canvas>
<script src="game.js"></script><script src="map.js"></script><script src="scene.js"></script><script src="scene2.js"></script>
<script>
// index.html?v=day | dusk   one phone screen (390x844 CSS px; render at device scale 3 for 1170x2532)
// index.html?v=zoom         the game's thorn spike next to the map's palm and hut, all at 2x their on-screen size
// index.html?s=2&v=day|dusk screen 2 (the temple, the bog and the first boss), the screen above screen 1
// index.html?v=stack&m=day|dusk   screen 2 above screen 1 (390x1688) to check the seam; screen 1 drawn at the same
//                           demo progress as screen 2 (levels 1-3 cleared, its roads lit, no pilot)
const Q = new URLSearchParams(location.search), v = Q.get('v') || 'day', scr = Q.get('s') || '1', mode = Q.get('m') || 'day';
const cv = document.getElementById('c'), c = cv.getContext('2d'), D = window.devicePixelRatio || 1;
const pic = n => Object.assign(new Image(), { src: '../../world-maps/pilots/' + n + '.png' });
const img = pic('lemur'), cham = pic('chameleon'), boss = pic('boss-flytrap');
function go() {
  try {
    if (v === 'zoom') {
      const w = 1300, h = 480; cv.width = w * D; cv.height = h * D; cv.style.width = w + 'px'; cv.style.height = h + 'px';
      c.setTransform(D, 0, 0, D, 0, 0);
      // left: the game's thorn on its jungle backdrop; right: the map's palm and hut on their sand, same zoom (2x)
      const bg = c.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, 'rgb(92,128,102)'); bg.addColorStop(1, 'rgb(44,72,58)');
      c.fillStyle = bg; c.fillRect(0, 0, 400, h);
      c.fillStyle = 'rgb(48,38,28)'; c.fillRect(0, 0, 30, h);
      gameThorn(c, 30, 200, 2);
      c.save(); c.beginPath(); c.rect(400, 0, 900, h); c.clip();
      const P = MAP.PAL.day;
      c.fillStyle = MAP.LG(c, 400, 0, 700, h, [P.grass.lit, P.grass.mid]); c.fillRect(400, 0, 900, h);
      c.translate(400, 0); c.scale(2, 2);
      MAP.palm(c, P, 55, 215, 84, 0.1, 8);
      MAP.broadTree(c, P, 150, 215, 112, 92, 23);
      MAP.hut(c, P, 320, 215, 0, 1.4);
      c.restore();
      c.font = '16px "Lilita One"'; c.fillStyle = '#fff'; c.fillText('game: thorn spike (2x)', 14, h - 14); c.fillText('map: palm, jungle tree, stilt hut (2x)', 414, h - 14);
    } else if (v === 'stack') {
      cv.width = 390 * D; cv.height = 1688 * D; cv.style.width = '390px'; cv.style.height = '1688px';
      c.setTransform(D, 0, 0, D, 0, 0);
      c.save(); c.beginPath(); c.rect(0, 0, 390, 844); c.clip(); SCENE2.drawScene(c, mode, cham, 0, boss); c.restore();
      c.save(); c.beginPath(); c.rect(0, 844, 390, 844); c.clip(); c.translate(0, 844); SCENE.drawScene(c, mode, img, 0, { prog: true }); c.restore();
    } else if (scr === '2') {
      cv.width = 390 * D; cv.height = 844 * D; cv.style.width = '390px'; cv.style.height = '844px';
      c.setTransform(D, 0, 0, D, 0, 0);
      SCENE2.drawScene(c, v, cham, 0, boss);
    } else {
      cv.width = 390 * D; cv.height = 844 * D; cv.style.width = '390px'; cv.style.height = '844px';
      c.setTransform(D, 0, 0, D, 0, 0);
      SCENE.drawScene(c, v, img, 0);
    }
  } catch (e) { c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = '#f33'; c.font = '30px monospace'; c.fillText(e.message.slice(0, 60), 8, 60); console.error(e); }
  document.title = 'done';
}
Promise.all([document.fonts.load('400 20px "Lilita One"').catch(() => 0), ...[img, cham, boss].map(im => new Promise(r => { if (im.complete) r(); else im.onload = im.onerror = r; }))]).then(go);
</script>
