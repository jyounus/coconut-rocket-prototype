<!doctype html><meta charset="utf-8"><title>Island Style Compare</title>
<style>html,body{margin:0;background:#151019;color:#eee;font:600 14px system-ui}#g{display:flex;gap:12px;padding:12px}figure{margin:0}figcaption{padding:6px 2px;text-align:center}canvas,img{display:block;height:780px;border-radius:8px}</style>
<div id="g"></div>
<script>window.PILOT_DIR = '../world-maps/pilots/';</script>
<script src="../world-maps/maps/kit.js"></script><script src="../world-maps/maps/levels.js"></script><script src="../world-maps/maps/island.js"></script>
<script>
// compare.html?dir=/abs/folder lays out: the game today, the concept's same area, A, B (all the same height)
const dir = new URLSearchParams(location.search).get('dir');
const fig = (el, cap) => { const f = document.createElement('figure'); f.append(el); const c = document.createElement('figcaption'); c.textContent = cap; f.append(c); g.append(f); };
const img = (src, cap) => { const i = new Image(); i.src = src; fig(i, cap); };
img('../zones-report/now-jungle.jpg', 'The game today');
setTimeout(() => {
  // the concept around levels 1-3 (concept px 170..470 x 560..1210, same aspect as the phone)
  const M = PV.maps.island, vx = 170, vy = 559, vw = 300, vh = 300 * 844 / 390, c = document.createElement('canvas');
  c.width = 780; c.height = 1688; c.style.width = '360px'; c.style.height = '780px';
  const ctx = c.getContext('2d'); ctx.scale(780 / vw, 780 / vw); ctx.translate(-vx, -vy);
  M.draw(ctx, 5, { x: vx, y: vy, w: vw, h: vh });
  fig(c, 'Concept (same area)');
  img('file://' + dir + '/A.png', 'A: Concept, polished');
  img('file://' + dir + '/B.png', 'B: Storybook rich');
}, 600);
</script>
