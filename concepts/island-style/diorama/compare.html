<!doctype html><meta charset="utf-8"><title>Diorama Compare</title>
<style>html,body{margin:0;background:#11161a}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
// compare.html?img=/abs/diorama.png&cx=..&cy=.. : now-jungle.jpg | the screen | a 1:1 device-pixel crop (2x the
// screen's displayed scale) at equal height
const q = new URLSearchParams(location.search), H = 1266, G = 16;
const load = s => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = s; });
Promise.all([load('../../zones-report/now-jungle.jpg'), load('file://' + q.get('img'))]).then(([a, b]) => {
  const wa = Math.round(a.width * H / a.height), wb = Math.round(b.width * H / b.height), wc = 600;
  const c = document.getElementById('c'); c.width = wa + wb + wc + G * 4; c.height = H + G * 2;
  const g = c.getContext('2d'); g.fillStyle = '#11161a'; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(a, G, G, wa, H); g.drawImage(b, G * 2 + wa, G, wb, H);
  const cx = +q.get('cx') || 570, cy = +q.get('cy') || 1150;
  g.drawImage(b, cx, cy, wc, H, G * 3 + wa + wb, G, wc, H);
  document.title = 'done';
});
</script>
