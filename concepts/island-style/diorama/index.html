<!doctype html><meta charset="utf-8"><title>Carved Diorama</title>
<meta name="viewport" content="width=390">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<style>html,body{margin:0;background:#0d1a20}canvas{display:block;width:390px;height:844px}</style>
<canvas id="c" width="1170" height="2532"></canvas>
<script src="art.js"></script><script src="scene.js"></script>
<script>
// One phone screen (390x844 CSS px) of the island's beach start, drawn at 3x device pixels.
const c = document.getElementById('c'), ctx = c.getContext('2d');
const go = () => { ctx.setTransform(3, 0, 0, 3, 0, 0); try { SCENE.drawScene(ctx); } catch (e) { ctx.setTransform(3, 0, 0, 3, 0, 0); ctx.fillStyle = '#f33'; ctx.font = '12px monospace'; ctx.fillText(e.message.slice(0, 60), 6, 30); ctx.fillText((e.stack || '').split('\n')[1] || '', 6, 46); console.error(e); } document.title = 'done'; };
Promise.all([document.fonts.load('400 20px "Lilita One"').catch(() => 0), new Promise(r => { if (SCENE.IMG.complete) r(); else SCENE.IMG.onload = SCENE.IMG.onerror = r; })]).then(go);
</script>
