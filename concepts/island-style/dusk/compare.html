<!doctype html><meta charset="utf-8"><title>Dusk Compare</title>
<style>html,body{margin:0;background:#121418;color:#ddd;font:600 15px system-ui}#g{display:flex;gap:14px;padding:14px}figure{margin:0}figcaption{padding:6px 2px;text-align:center}img,canvas{display:block;height:900px;border-radius:8px}</style>
<div id="g"></div>
<script>
// compare.html?dir=/abs/folder : the game today | this screen | a 2x crop of the most detailed area (hut + pad + surf)
const dir = new URLSearchParams(location.search).get('dir'), g = document.getElementById('g');
const fig = (el, cap) => { const f = document.createElement('figure'); f.append(el); const c = document.createElement('figcaption'); c.textContent = cap; f.append(c); g.append(f); };
const a = new Image(); a.src = '../../zones-report/now-jungle.jpg'; fig(a, 'The game today (jungle)');
const b = new Image(); b.src = 'file://' + dir + '/dusk.png'; fig(b, 'Dusk painted');
b.onload = () => {
  // 2x crop: half the screen's width/height, centred on the hut, pad and surf (device px)
  const cw = 585, ch = 1266, sx = 1170 - cw, sy = 2532 - ch, c = document.createElement('canvas'); c.width = cw; c.height = ch;
  c.getContext('2d').drawImage(b, sx, sy, cw, ch, 0, 0, cw, ch); fig(c, '2x crop (hut, pad, surf)');
};
</script>
