<!doctype html><meta charset="utf-8"><title>Dusk Island Sample</title>
<meta name="viewport" content="width=390">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<style>html,body{margin:0;background:#0d1a1c}canvas{display:block;width:390px;height:844px}</style>
<canvas id="c" width="1170" height="2532"></canvas>
<script src="paint.js"></script><script src="scene.js"></script>
<script>
// One phone screen (390x844 CSS px) of Coconut Island in the "Dusk painted" style, drawn at 3x device pixels.
const c = document.getElementById('c'), ctx = c.getContext('2d'), pilot = new Image();
pilot.src = '../../world-maps/pilots/lemur.png';
const go = () => { try { DUSK_SCENE.drawScene(ctx, 3, pilot); } catch (e) { ctx.setTransform(3, 0, 0, 3, 0, 0); ctx.fillStyle = '#f33'; ctx.font = '12px monospace'; ctx.fillText(e.message.slice(0, 60), 8, 30); console.error(e); } document.title = 'done'; };
Promise.all([document.fonts.load('400 20px "Lilita One"').catch(() => 0), new Promise(r => { pilot.onload = pilot.onerror = r; })]).then(go);
</script>
