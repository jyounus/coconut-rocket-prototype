<!doctype html><meta charset="utf-8"><title>Gouache Compare</title>
<style>html,body{margin:0;background:#151019}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
// compare.html?dir=/abs/folder: the game today | the gouache screen | a 2x crop (native device px) of its hut area, all 1266 px tall
const q = new URLSearchParams(location.search), dir = q.get('dir'), crop = (q.get('crop') || '750,1620,450,750').split(',').map(Number);
const H = 1266, load = s => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = s; });
Promise.all([load('../../zones-report/now-jungle.jpg'), load('file://' + dir + '/gouache.png')]).then(([a, b]) => {
  const wa = Math.round(400 / 708 * H), wb = Math.round(1170 / 2532 * H), wc = Math.round(crop[2] / crop[3] * H), gap = 16;
  const c = document.getElementById('c'); c.width = wa + wb + wc + gap * 4; c.height = H + gap * 2; c.style.width = c.width + 'px';
  const x = c.getContext('2d'); x.fillStyle = '#151019'; x.fillRect(0, 0, c.width, c.height); x.imageSmoothingQuality = 'high';
  if (a) x.drawImage(a, gap, gap, wa, H);
  if (b) { x.drawImage(b, gap * 2 + wa, gap, wb, H); x.drawImage(b, crop[0], crop[1], crop[2], crop[3], gap * 3 + wa + wb, gap, wc, H); }
  document.title = 'done';
});
</script>
