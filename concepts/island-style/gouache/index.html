<!doctype html><meta charset="utf-8"><title>Gouache Island</title>
<meta name="viewport" content="width=390">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<style>html,body{margin:0;background:#cfd8d2}canvas{display:block;width:390px;height:844px}</style>
<canvas id="c" width="1170" height="2532"></canvas>
<script src="paint.js"></script><script src="scene.js"></script>
<script>
// One phone screen (390x844 CSS px) painted at 3x device px in the "soft gouache" direction.
const c = document.getElementById('c'), ctx = c.getContext('2d'), img = new Image();
img.src = '../../world-maps/pilots/lemur.png';
const go = () => { ctx.setTransform(3, 0, 0, 3, 0, 0); try { SCENE.drawScene(ctx, img); } catch (e) { ctx.setTransform(3, 0, 0, 3, 0, 0); ctx.fillStyle = '#f33'; ctx.font = '12px monospace'; ctx.fillText(e.message.slice(0, 60), 8, 30); ctx.fillText((e.stack || '').split('\n')[1]?.slice(-60) || '', 8, 46); console.error(e); } document.title = 'done'; };
Promise.all([document.fonts.load('400 20px "Lilita One"').catch(() => 0), new Promise(r => { img.onload = img.onerror = r; })]).then(go);
</script>
